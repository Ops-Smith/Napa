name: "Test Actions"

on:
    workflow_run:
        workflows: ["Hello Actions"]
        types:
            - completed
    push:
        branches: [master]
        paths-ignore:
            - "README.md"

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            # FIX 3: Moved checkout to the absolute beginning so 'ls -la' and 'git status' actually work
            - name: Get the code
              uses: actions/checkout@v4

            # 2. Force the runner container context to explicitly load Node.js 24
            - name: Set up Node.js 24
              uses: actions/setup-node@v4
              with:
                node-version: '24'
                cache: 'npm'
                cache-dependency-path: app/package-lock.json

            # These will now correctly display your repository's root structure
            - name: Check the code
              run: |
                  ls -la
                  git status

            # FIX 4: Ensured case-sensitive directory matches your tree ('app' in lowercase)
            - name: Install Dependencies
              run: npm install
              working-directory: app

            # FIX 5: Redirect test logs to test_results.txt inside the app directory
            - name: Run Tests
              run: npm test > test_results.txt 2>&1 || true
              working-directory: app

            - name: Write the test summary
              if: always()
              run: |
                 SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

                 echo "### Test results" >> "$GITHUB_STEP_SUMMARY"
                 echo '```' >> "\$GITHUB_STEP_SUMMARY"
                 
                 # FIX 6: Read log file from the correct relative path (inside app/)
                 if [ -f ./app/test_results.txt ]; then
                   cat ./app/test_results.txt >> "\$GITHUB_STEP_SUMMARY"
                 else
                   echo "No test logs captured." >> "\$GITHUB_STEP_SUMMARY"
                 fi
                 
                 echo '```' >> "$GITHUB_STEP_SUMMARY"
                 echo '```' >> "\$GITHUB_STEP_SUMMARY"
                 echo "Commit: \(SHORT_SHA" >> "\)GITHUB_STEP_SUMMARY"
                 echo '```' >> "$GITHUB_STEP_SUMMARY"
