name: "Test Actions"

on:
    workflow_run:
        workflows: ["Hello Actions"]
        types:
          - completed
    push:
        branches: [master]
        paths-ignore:
          - "README.md"

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            # FIX 3: Moved checkout to the absolute beginning so 'ls -la' and 'git status' actually work
            - name: Get the code
              uses: actions/checkout@v4.2.2
              with:
                fetch-depth: 0  # Fetch all history for all branches and tags

            # Extract the version from package.json and save it to env context
            - name: Extract Project Version
              id: get_version
              run: |
                VERSION=$(node -p "require('./app/package.json').version")
                echo "version=$VERSION" >> $GITHUB_ENV

            # NEW: Send the start notification email cleanly on Node 24 compatible engines
            - name: 📧 Notify Development Start
              uses: dawidd6/action-send-mail@v4
              with:
                server_address: smtp.gmail.com
                server_port: 465
                secure: true
                username: ${{ secrets.EMAIL }}
                password: ${{ secrets.EMAIL_PASSWORD }}
                subject: "🚀 Development Pipeline Started"
                to: ${{ secrets.EMAIL }}
                from: "DevOps Admin"
                body: |
                  Development pipeline has started!
                  Branch: ${{ github.ref_name }}
                  Version: ${{ env.version }}

            # 2. Force the runner container context to explicitly load Node.js 24
            - name: Set up Node.js 24
              uses: actions/setup-node@v4.2.0
              with:
                node-version: '24'
                cache: 'npm'
                cache-dependency-path: app/package-lock.json

            # These will now correctly display your repository's root structure
            - name: Check the code
              run: |
                  ls -la
                  git status

            # FIX 4: Ensured case-sensitive directory matches your tree ('app' in lowercase)
            - name: Install Dependencies
              run: npm install
              working-directory: app

            # FIX 5: Redirect test logs to test_results.txt inside the app directory
            - name: Run Tests
              run: npm test > test_results.txt 2>&1 || true
              working-directory: app

            - name: Write the test summary
              if: always()
              run: |
                SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

                echo "### Test Results" >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"

                if [ -f ./app/test_results.txt ]; then
                  sed -r "s/\x1B\[([0-9]{1,3}(;[0-9]{1,2})?)?[mGK]//g" ./app/test_results.txt >> "$GITHUB_STEP_SUMMARY"
                else
                   echo "No test logs captured." >> "$GITHUB_STEP_SUMMARY"
                fi
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                echo "**Commit:** \`$SHORT_SHA\`" >> "$GITHUB_STEP_SUMMARY"

            - name: Show the Trivy report
              if: always()
              run: |
                if [ -f ./app/trivy-results.txt ]; then
                  echo "### Trivy Scan Results" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  # Strip ANSI color codes before appending to the summary
                  sed -r "s/\x1B\[([0-9]{1,3}(;[0-9]{1,2})?)?[mGK]//g" ./app/trivy-results.txt >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "Trivy log file not found." >> "$GITHUB_STEP_SUMMARY"
                fi

            # Check if tests failed in the log file, and fail the job if they did
            - name: Evaluate Test Status
              run: |
                if grep -qi "fail" ./app/test_results.txt; then
                  echo "Tests detected a failure status."
                  exit 1
                fi

            # Notify Development Failure (Upgraded to v4 to clear warnings)
            - name: 📧 Notify Development Failure
              if: failure()
              uses: dawidd6/action-send-mail@v4
              with:
                server_address: smtp.gmail.com
                server_port: 465
                secure: true
                username: ${{ secrets.EMAIL }}
                password: ${{ secrets.EMAIL_PASSWORD }}
                subject: "❌ Development Stage Failed - Version ${{ env.version }}"
                to: ${{ secrets.EMAIL }}
                from: "DevOps Admin"
                body: |
                  ❌ Development stage failed!
                  
                  🚨 Build or tests failed in development
                  Branch: ${{ github.ref_name }}
                  Version: ${{ env.version }}