name: "Deploy Actions"

on:
    workflow_run:
        workflows: ["Build Actions"]
        types:
            - completed

permissions:
    contents: read
    actions: read

jobs:
    deploy-container:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        steps:
            # 1. Download the Docker image archive tar file
            - name: Download Image Artifact Across Workflows
              uses: dawidd6/action-download-artifact@v6
              with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                workflow: "Build Actions"
                name: napa-docker-artifact
                run_id: ${{ github.event.workflow_run.id }}

            # FIX: If you want to download text logs from the parent build, download them first before archiving them
            - name: Download Test Text Logs Across Workflows
              uses: dawidd6/action-download-artifact@v6
              with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                workflow: "Build Actions"
                name: pipeline-text-logs
                run_id: ${{ github.event.workflow_run.id }}
                # Gracefully skip if it wasn't uploaded in the build step to prevent deployment halts
                if_no_artifact_found: warn 
            
            - name: Extract Project Version
              id: get_version
              run: |
                echo "version=1.0.0" >> $GITHUB_ENV

            # This step will now execute cleanly since files are downloaded onto the runner filesystem
            - name: Archive Test Logs
              uses: actions/upload-artifact@v4
              with:
                name: deployed-pipeline-text-logs
                path: |
                    app/test_results.txt
                    trivy-results.txt
                if-no-files-found: ignore
                retention-days: 5
            
            # 2. Start Email Notification
            - name: 📧 Notify Deployment Start
              uses: dawidd6/action-send-mail@v4
              with:
                server_address: smtp.gmail.com
                server_port: 465
                secure: true
                username: ${{ secrets.EMAIL }}
                password: ${{ secrets.EMAIL_PASSWORD }}
                subject: "🚀 Deployment Pipeline Started"
                to: ${{ secrets.EMAIL }}
                from: "DevOps Admin"
                body: |
                  Development pipeline has started!
                  Branch: ${{ github.ref_name }}
                  Version: ${{ env.version }}

            - name: Load Docker Image
              run: |
                ls -la
                docker load -i napa-image.tar

            - name: Run Containerized Application
              run: |
                docker ps -q --filter "name=napa-app" | xargs -r docker stop
                docker ps -aq --filter "name=napa-app" | xargs -r docker rm
                
                # FIX: Pass your MongoDB URI environment variable directly to the container instance
                docker run -d --name napa-app -p 3000:3000 --restart always \
                  -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
                  $(docker images --format "{{.Repository}}:{{.Tag}}" | grep "napa" | head -n 1)
                
                sleep 5
                docker ps
                docker logs napa-app


            # 3. Success Email Notification
            - name: 📧 Notify Deployment Success
              if: success()
              uses: dawidd6/action-send-mail@v4
              with:
                server_address: smtp.gmail.com
                server_port: 465
                secure: true
                username: ${{ secrets.EMAIL }}
                password: ${{ secrets.EMAIL_PASSWORD }}
                subject: "✅ Container Deployed Successfully - Version ${{ env.version }}"
                to: ${{ secrets.EMAIL }}
                from: "DevOps Admin"
                body: |
                  🎉 Success! The container application is live on the server environment.
                  
                  Branch: ${{ github.ref_name }}
                  Version: ${{ env.version }}

            # 4. Failure Email Notification
            - name: 📧 Notify Deployment Failure
              if: failure()
              uses: dawidd6/action-send-mail@v4
              with:
                server_address: smtp.gmail.com
                server_port: 465
                secure: true
                username: ${{ secrets.EMAIL }}
                password: ${{ secrets.EMAIL_PASSWORD }}
                subject: "❌ Deployment Stage Failed - Version ${{ env.version }}"
                to: ${{ secrets.EMAIL }}
                from: "DevOps Admin"
                body: |
                  ❌ Deployment stage failed!
                  
                  🚨 The Docker container failed to launch or load correctly.
                  Branch: ${{ github.ref_name }}
                  Version: ${{ env.version }}

            # 5. Summary Matrix Table
            - name: Summary table
              if: always()
              run: |
                SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha || github.sha }}" | cut -c1-7)
                {
                echo "### Pipeline status"
                echo ""
                echo "| Check | Result |"
                echo "|---|---|"
                echo "| App Deployment | ${{ job.status }} |"
                echo "| Commit | $SHORT_SHA |"
                echo "| Branch | $GITHUB_REF_NAME |"
                } >> "$GITHUB_STEP_SUMMARY"
