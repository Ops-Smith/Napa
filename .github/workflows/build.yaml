name: "Build Actions"

on:
    workflow_run:
        workflows: ["Test Actions"]
        types:
            - completed
    push:
        branches: [master]
        paths-ignore:
            - "README.md"

permissions:
    contents: read
    packages: write

jobs:
    build-the-docker-image:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
        steps:
            - name: Get the code
              uses: actions/checkout@v4.2.2
              with:
                ref: ${{ github.event.workflow_run.head_sha || github.sha }}
                fetch-depth: 0

            # Extract the version from package.json and save it to env context
            - name: Extract Project Version
              id: get_version
              run: |
                VERSION=$(node -p "require('./app/package.json').version")
                echo "version=$VERSION" >> $GITHUB_ENV

            # 1. Start Email Notification
            - name: 📧 Notify Development Start
              uses: dawidd6/action-send-mail@v4
              with:
                server_address: smtp.gmail.com
                server_port: 465
                secure: true
                username: ${{ secrets.EMAIL }}
                password: ${{ secrets.EMAIL_PASSWORD }}
                subject: "🚀 Development Pipeline Started"
                to: ${{ secrets.EMAIL }}
                from: "DevOps Admin"
                body: |
                  Development pipeline has started!
                  Branch: ${{ github.ref_name }}
                  Version: ${{ env.version }}

            - name: Set Up Docker
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              id: docker_build
              uses: docker/build-push-action@v6
              with:
                context: .
                file: ./Dockerfile
                push: true
                load: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/napa:${{ github.event.workflow_run.head_sha || github.sha }}

            # Save the compiled Docker image into a tarball archive file
            - name: Archive Docker Image
              run: |
                docker save ${{ secrets.DOCKERHUB_USERNAME }}/napa:${{ github.event.workflow_run.head_sha || github.sha }} -o napa-image.tar

            # Upload Image Artifact
            - name: Upload Image Artifact
              uses: actions/upload-artifact@v4
              with:
                name: napa-docker-artifact
                path: napa-image.tar
                retention-days: 1

            # 2. Scan the image with Trivy (This creates trivy-results.txt)
            - name: Scan the image with Trivy
              uses: aquasecurity/trivy-action@0.35.0
              with:
                image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/napa:${{ github.event.workflow_run.head_sha || github.sha }}'
                format: table
                output: trivy-results.txt
                severity: CRITICAL,HIGH
                ignore-unfixed: true
                exit-code: "0"

            # FIX: Moved this step down so trivy-results.txt actually exists before archiving!
            - name: Archive Test and Scan Logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: pipeline-text-logs
                path: |
                    app/test_results.txt
                    trivy-results.txt
                # Prevents a pipeline crash if app/test_results.txt isn't in this job's workspace directory
                if-no-files-found: warn
                retention-days: 5

            # 3. Show the Trivy report in GitHub Summary
            - name: Show the Trivy report
              if: always()
              run: |
                  if [ -f trivy-results.txt ]; then
                    cat trivy-results.txt
                    {
                      echo "### Trivy scan results"
                      echo '```'
                      cat trivy-results.txt
                      echo '```'
                    } >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "Trivy log file not found." >> "$GITHUB_STEP_SUMMARY"
                  fi

            # 4. Success Email Notification
            - name: 📧 Notify Development Build Success
              if: success()
              uses: dawidd6/action-send-mail@v4
              with:
                server_address: smtp.gmail.com
                server_port: 465
                secure: true
                username: ${{ secrets.EMAIL }}
                password: ${{ secrets.EMAIL_PASSWORD }}
                subject: "✅ Development Stage Built Successfully - Version ${{ env.version }}"
                to: ${{ secrets.EMAIL }}
                from: "DevOps Admin"
                body: |
                  🎉 Success! The Docker image has built, passed vulnerability scans, and pushed cleanly.
                  
                  📦 Image Tag: ${{ secrets.DOCKERHUB_USERNAME }}/napa:${{ github.event.workflow_run.head_sha || github.sha }}
                  Branch: ${{ github.ref_name }}
                  Version: ${{ env.version }}

            # 5. Failure Email Notification
            - name: 📧 Notify Development Failure
              if: failure()
              uses: dawidd6/action-send-mail@v4
              with:
                server_address: smtp.gmail.com
                server_port: 465
                secure: true
                username: ${{ secrets.EMAIL }}
                password: ${{ secrets.EMAIL_PASSWORD }}
                subject: "❌ Development Stage Failed - Version ${{ env.version }}"
                to: ${{ secrets.EMAIL }}
                from: "DevOps Admin"
                body: |
                  ❌ Development stage failed!
                  
                  🚨 Build, tests, or Trivy vulnerability scan failed in development
                  Branch: ${{ github.ref_name }}
                  Version: ${{ env.version }}

            # 6. Markdown Summary Matrix Table Layout
            - name: Summary table
              if: always()
              run: |
                SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha || github.sha }}" | cut -c1-7)
                {
                echo "### Pipeline status"
                echo ""
                echo "| Check | Result |"
                echo "|---|---|"
                echo "| Docker Build | ${{ job.status }} |"
                echo "| Commit | $SHORT_SHA |"
                echo "| Branch | $GITHUB_REF_NAME |"
                } >> "$GITHUB_STEP_SUMMARY"
