name: "Build Actions"

on:
    workflow_run:
        workflows: ["Test Actions"]
        types:
            - completed
    push:
        branches: [master]
        paths-ignore:
            - "README.md"

permissions:
    contents: read
    packages: write

jobs:
    build-the-docker-image:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
        steps:
            - name: Get the code
              uses: actions/checkout@v4.2.2
              with:
                ref: ${{ github.event.workflow_run.head_sha || github.sha }}
                fetch-depth: 0

            # Extract the version from package.json and save it to env context
            - name: Extract Project Version
              id: get_version
              run: |
                VERSION=$(node -p "require('./app/package.json').version")
                echo "version=$VERSION" >> $GITHUB_ENV

            # 1. Start Email Notification
            - name: 📧 Notify Development Start
              uses: dawidd6/action-send-mail@v4
              with:
                server_address: smtp.gmail.com
                server_port: 465
                secure: true
                username: ${{ secrets.EMAIL }}
                password: ${{ secrets.EMAIL_PASSWORD }}
                subject: "🚀 Development Pipeline Started"
                to: ${{ secrets.EMAIL }}
                from: "DevOps Admin"
                body: |
                  Development pipeline has started!
                  Branch: ${{ github.ref_name }}
                  Version: ${{ env.version }}

            - name: Set Up Docker
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              id: docker_build
              uses: docker/build-push-action@v6
              with:
                context: .
                file: ./Dockerfile
                push: true
                # FIX 1: Also export to the local Docker daemon workspace so Trivy can see it
                load: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/napa:${{ github.event.workflow_run.head_sha || github.sha }}

            # 2. Scan the image with Trivy
            - name: Scan the image with Trivy
              uses: aquasecurity/trivy-action@0.35.0
              with:
                # FIX 2: Replaced invalid 'store-${{ matrix.component }}:ci' with your exact local image tag
                image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/napa:${{ github.event.workflow_run.head_sha || github.sha }}'
                format: table
                output: trivy-results.txt
                severity: CRITICAL,HIGH
                ignore-unfixed: true
                exit-code: "0"

            # 3. Show the Trivy report in GitHub Summary
            - name: Show the Trivy report
              if: always()
              run: |
                  # FIX 3: Replaced non-existent matrix filenames with standard fallback checks
                  if [ -f trivy-results.txt ]; then
                    cat trivy-results.txt
                    {
                      echo "### Trivy scan results"
                      echo '```'
                      cat trivy-results.txt
                      echo '```'
                    } >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "Trivy log file not found." >> "$GITHUB_STEP_SUMMARY"
                  fi

            # 4. Success Email Notification
            - name: 📧 Notify Development Build Success
              if: success()
              uses: dawidd6/action-send-mail@v4
              with:
                server_address: smtp.gmail.com
                server_port: 465
                secure: true
                username: ${{ secrets.EMAIL }}
                password: ${{ secrets.EMAIL_PASSWORD }}
                subject: "✅ Development Stage Built Successfully - Version ${{ env.version }}"
                to: ${{ secrets.EMAIL }}
                from: "DevOps Admin"
                body: |
                  🎉 Success! The Docker image has built, passed vulnerability scans, and pushed cleanly.
                  
                  📦 Image Tag: ${{ secrets.DOCKERHUB_USERNAME }}/napa:${{ github.event.workflow_run.head_sha || github.sha }}
                  Branch: ${{ github.ref_name }}
                  Version: ${{ env.version }}

            # 5. Failure Email Notification
            - name: 📧 Notify Development Failure
              if: failure()
              uses: dawidd6/action-send-mail@v4
              with:
                server_address: smtp.gmail.com
                server_port: 465
                secure: true
                username: ${{ secrets.EMAIL }}
                password: ${{ secrets.EMAIL_PASSWORD }}
                subject: "❌ Development Stage Failed - Version ${{ env.version }}"
                to: ${{ secrets.EMAIL }}
                from: "DevOps Admin"
                body: |
                  ❌ Development stage failed!
                  
                  🚨 Build, tests, or Trivy vulnerability scan failed in development
                  Branch: ${{ github.ref_name }}
                  Version: ${{ env.version }}
