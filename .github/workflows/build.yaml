# This is the name of the workflow
name: "Build"

# This is the event that will trigger the workflow
on:
    workflow_run:
        workflows: ["Test CI"]
    push:
        branches: [master]
        # This ensures that files or folders listed won't trigger the workflow
        paths-ignore:
            - "README.md"
permissions:
    contents: read
    packages: write

# This is the job that the bot will run
jobs:
    Build the Docker Image:
        runs-on: ubuntu-latest
        steps:
            - name: Set Up Docker
              uses: docker/setup-buildx-action@v4
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Build and push
              id: docker_build
              uses: docker/build-push-action@v5
              with:
                context: .
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/napa:${{ github.sha }}