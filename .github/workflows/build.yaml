name: "Build Actions"

on:
    workflow_run:
        workflows: ["Test Actions"]
        types:
            - completed
    push:
        branches: [master]
        paths-ignore:
            - "README.md"

permissions:
    contents: read
    packages: write

jobs:
    build-the-docker-image:
        runs-on: ubuntu-latest
        steps:
            # FIX 1: ALWAYS checkout the code first before setting up tools
            - name: Get the code
              uses: actions/checkout@v4

            # FIX 2: Downgraded to latest stable production release (v3)
            - name: Set Up Docker
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              id: docker_build
              uses: docker/build-push-action@v6
              with:
                context: .
                file: ./Dockerfile
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/napa:${{ github.sha }}
