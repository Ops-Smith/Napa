# This is the name of the workflow
name: "Hello Actions"

# This is the event that will trigger the workflow
on:
    push:
        branches: [master]

# This is the job that the bot will run
jobs:
    Say Hello:
        runs-on: ubuntu-latest
        steps:
            - name: say-hello
              run: echo "Hello from GitHub Actions!"

            - name: Look at the folder before checkout
              run: ls -la

            - name: Get the code
              uses: actions/checkout@v5
            
            - name: Look at the folder after checkout
              run: ls -la
            
            - name: Get facts about this run
              run: |
                  echo "Repository: ${{ github.repository }}"
                  echo "Branch: ${{ github.ref_name }}"
                  echo "Commit: ${{ github.sha }}"
                  echo "Started by: ${{ github.actor }}"

            - name: Get facts about the machine
              run: |
                  uname -a
                  python3 --version
                  pip3 --version
                  docker --version
