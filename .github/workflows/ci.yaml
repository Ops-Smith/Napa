# This is the name of the workflow
name: "Hello Actions"

# This is the event that will trigger the workflow
on:
    push:
        branches: [master]
        paths-ignore:
            - "README.md"

permissions:
    contents: read

# This is the job that the bot will run
jobs:
    say-hello:
        runs-on: ubuntu-latest
        steps:
            - name: Say hello
              run: echo "Hello from GitHub Actions!"

            - name: Look at the folder before checkout
              run: ls -la

            # FIX 1: Downgraded checkout to the stable production version to clear deprecation warnings
            - name: Get the code
              uses: actions/checkout@v4.2.2
              with:
                fetch-depth: 0
            
            - name: Look at the folder after checkout
              run: ls -la

            # NEW: Extract the version from package.json and save it to env context
            - name: Extract Project Version
              id: get_version
              run: |
                VERSION=$(node -p "require('./app/package.json').version")
                echo "version=$VERSION" >> $GITHUB_ENV

            # NEW: Send the start notification email cleanly on Node 24 compatible engines
            - name: 📧 Notify Development Start
              uses: dawidd6/action-send-mail@v4
              with:
                server_address: smtp.gmail.com
                server_port: 465
                secure: true
                username: ${{ secrets.EMAIL }}
                password: ${{ secrets.EMAIL_PASSWORD }}
                subject: "🚀 Development Pipeline Started"
                to: ${{ secrets.EMAIL }}
                from: "DevOps Admin"
                body: |
                  Development pipeline has started!
                  Branch: ${{ github.ref_name }}
                  Version: ${{ env.version }}
            
            - name: Get facts about this run
              run: |
                  echo "Repository: ${{ github.repository }}"
                  echo "Branch: ${{ github.ref_name }}"
                  echo "Commit: ${{ github.sha }}"
                  echo "Started by: ${{ github.actor }}"

            - name: Get facts about the machine
              run: |
                  uname -a
                  python3 --version
                  pip3 --version
                  docker --version

            # NEW: Notify Development Failure (Upgraded to v4 to clear warnings)
            - name: 📧 Notify Development Failure
              if: failure()
              uses: dawidd6/action-send-mail@v4
              with:
                server_address: smtp.gmail.com
                server_port: 465
                secure: true
                username: ${{ secrets.EMAIL }}
                password: ${{ secrets.EMAIL_PASSWORD }}
                subject: "❌ Development Stage Failed - Version ${{ env.version }}"
                to: ${{ secrets.EMAIL }}
                from: "DevOps Admin"
                body: |
                  ❌ Development stage failed!
                  
                  🚨 Build or tests failed in development
                  Branch: ${{ github.ref_name }}
                  Version: ${{ env.version }}

            - name: Summary table
              if: always()
              run: |
                SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
                {
                echo "### Pipeline status"
                echo ""
                echo "| Check | Result |"
                echo "|---|---|"
                echo "| CI Hello Run | ${{ job.status }} |"
                echo "| Commit | $SHORT_SHA |"
                echo "| Branch | $GITHUB_REF_NAME |"
                } >> "$GITHUB_STEP_SUMMARY"
